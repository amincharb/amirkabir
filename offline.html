<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کلاس 203 امیرکبیر | آفلاین</title>
    <link rel="icon" type="image/png" href="icon/student.png">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        @font-face {
            font-family: "vz";
            src: url(font/Vazirmatn-SemiBold.ttf) format(truetype);
        }
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: "vz", Tahoma, sans-serif;
            background: #ffffff;
            color: #111111;
            padding: 24px;
            box-sizing: border-box;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #111111; color: #f1f1f1; }
        }
        img { width: 72px; height: 72px; margin-bottom: 16px; }
        h1 { font-size: 1.3rem; margin: 0 0 8px; }
        p { margin: 0 0 20px; line-height: 1.9; opacity: .8; }
        a, button {
            font: inherit;
            display: inline-block;
            padding: 10px 22px;
            margin: 4px;
            border-radius: 12px;
            border: 1px solid currentColor;
            background: transparent;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="icon/student.png" alt="">
        <h1>الان آفلاین هستید</h1>
        <p>این صفحه هنوز روی دستگاه شما ذخیره نشده.<br>
           وقتی به اینترنت وصل شدید دوباره امتحان کنید.</p>
        <a href="amirkabir/index.html">صفحه اصلی</a>
        <button onclick="location.reload()">تلاش دوباره</button>
    </main>
</body>
</html>
